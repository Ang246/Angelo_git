<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-1">
        <h2 class="text-upeu-primary">Gestión de Productos</h2>
        <a routerLink="/productos/nuevo" class="btn btn-success">Agregar Producto</a>
    </div>

    <table class="table table-hover shadow-sm">
        <thead class="bg-upeu-primary text-white">
            <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            @for (prod of products; track prod.id) {
                <tr>
                   <td>
                    <img [src]="prod.imagen" width="50" class="rounded">
                   </td>
                   <td>{{prod.nombre }}</td>
                    <td>{{prod.precio}}</td>
                    <td>{{prod.stock}}</td>
                    <td>
                        <a [routerLink] ="['/productos/editar', prod.id]"  class="btn btn-sm btn-warning me-2">Editar</a>
                        <button (click)="eliminarProducto(prod.id!)" class="btn btn-sm btn-danger">Eliminar</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>
